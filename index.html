<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雀卓成績帳 | 麻雀リーグ成績</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --felt-deep: #123a2c;
      --felt-deep2: #0c2820;
      --felt-line: rgba(241, 232, 214, 0.12);
      --ivory: #f2e9d7;
      --ivory-soft: #e9dcbf;
      --ink: #241d15;
      --ink-soft: #6b6047;
      --gold: #c9a227;
      --gold-soft: #e8cd6d;
      --red: #b23a32;
      --red-soft: #d97a6f;
      --green-tile: #2f6b52;
      --ok: #7fd8ac;
      --shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(200, 166, 60, 0.10), transparent 60%),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.02) 0 2px, transparent 2px 26px),
        linear-gradient(180deg, var(--felt-deep) 0%, var(--felt-deep2) 100%);
      color: var(--ivory);
      font-family: 'Zen Kaku Gothic New', sans-serif;
      font-feature-settings: "palt";
      min-height: 100vh;
    }

    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    button {
      font-family: inherit;
    }

    /* ---------- Header ---------- */
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(200, 166, 60, 0.10), transparent 60%),
        linear-gradient(180deg, var(--felt-deep) 0%, var(--felt-deep2) 100%);
      transition: opacity 0.4s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-tile {
      text-align: center;
      color: var(--ivory);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border-radius: 8px;
      background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory-soft) 100%);
      animation: spin-tile 1.1s ease-in-out infinite;
      box-shadow: var(--shadow);
    }

    @keyframes spin-tile {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(0.85); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .loading-text {
      font-family: 'Shippori Mincho', serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: .08em;
      color: var(--gold-soft);
    }

    .loading-sub {
      font-size: 11.5px;
      color: var(--ivory-soft);
      opacity: .6;
      margin-top: 8px;
    }

    .lock-card {
      background: rgba(241, 232, 214, 0.04);
      border: 1px solid var(--felt-line);
      border-radius: 14px;
      padding: 40px 30px;
      max-width: 320px;
      margin: 40px auto 0;
      text-align: center;
    }

    .lock-card .lock-icon {
      font-size: 28px;
      margin-bottom: 14px;
    }

    .lock-card p {
      font-size: 12.5px;
      color: var(--ivory-soft);
      opacity: .75;
      margin: 0 0 18px;
      line-height: 1.7;
    }

    .lock-input {
      width: 140px;
      text-align: center;
      font-size: 22px;
      letter-spacing: .5em;
      padding: 10px 0 10px 0.5em;
      margin-bottom: 14px;
    }

    .lock-error {
      font-size: 12px;
      color: var(--red-soft);
      min-height: 16px;
      margin-bottom: 10px;
    }

    header {
      padding: 56px 20px 32px;
      text-align: center;
      position: relative;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: .35em;
      color: var(--gold-soft);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      font-family: 'Shippori Mincho', serif;
      font-weight: 800;
      font-size: clamp(32px, 6vw, 52px);
      margin: 0 0 10px;
      letter-spacing: .06em;
      color: var(--ivory);
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
    }

    h1 span {
      color: var(--gold-soft);
    }

    .lede {
      color: var(--ivory-soft);
      font-size: 14px;
      opacity: .8;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.9;
    }

    .tile-rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 26px auto 0;
    }

    .tile-rule .dot {
      width: 6px;
      height: 6px;
      background: var(--gold);
      border-radius: 1px;
      transform: rotate(45deg);
      opacity: .7;
    }

    .tile-rule .bar {
      width: 60px;
      height: 1px;
      background: var(--felt-line);
    }

    .header-actions {
      display: flex;
      justify-content: center;
      margin-top: 22px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--gold);
      color: #2b2103;
      border: none;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .03em;
      cursor: pointer;
      text-decoration: none;
      transition: transform .12s, box-shadow .12s;
      box-shadow: 0 10px 24px -12px rgba(201, 162, 39, 0.6);
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn.ghost {
      background: transparent;
      color: var(--gold-soft);
      border: 1px solid var(--felt-line);
      box-shadow: none;
    }

    .btn.danger {
      background: var(--red);
      color: #fff;
      box-shadow: 0 10px 24px -12px rgba(178, 58, 50, 0.6);
    }

    .btn.small {
      padding: 6px 12px;
      font-size: 12px;
    }

    /* ---------- Section shell ---------- */
    section {
      margin-top: 64px;
    }

    .sec-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid var(--felt-line);
      padding-bottom: 12px;
      margin-bottom: 22px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .sec-head h2 {
      font-family: 'Shippori Mincho', serif;
      font-size: 22px;
      margin: 0;
      letter-spacing: .05em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sec-head h2::before {
      content: "";
      width: 10px;
      height: 10px;
      background: var(--gold);
      display: inline-block;
      transform: rotate(45deg);
      border-radius: 2px;
    }

    .sec-note {
      font-size: 12px;
      color: var(--ivory-soft);
      opacity: .65;
    }

    /* ---------- Rank strip (全員表示) ---------- */
    .rank-strip {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .rank-tile {
      background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory-soft) 100%);
      border-radius: 10px 10px 6px 6px;
      color: var(--ink);
      width: 148px;
      padding: 18px 12px 16px;
      box-shadow: var(--shadow), inset 0 2px 0 rgba(255, 255, 255, 0.6), inset 0 -6px 0 rgba(0, 0, 0, 0.06);
      position: relative;
      text-align: center;
      opacity: 0;
      animation: rise .6s cubic-bezier(.2, .9, .25, 1) forwards;
    }

    .rank-tile::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 6px;
      height: 3px;
      background: var(--green-tile);
      border-radius: 2px;
      opacity: .5;
    }

    .rank-tile.unranked {
      opacity: .55 !important;
      animation: none;
      box-shadow: none;
      background: rgba(241, 232, 214, 0.5);
    }

    .rt-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-family: 'Shippori Mincho', serif;
      font-weight: 800;
      font-size: 15px;
      background: var(--felt-line);
      color: var(--ink-soft);
    }

    .rt-badge.r1 {
      background: var(--gold);
      color: #2b2103;
    }

    .rt-badge.r2 {
      background: #cfd6d1;
      color: #26332c;
    }

    .rt-badge.r3 {
      background: #8a6a3a;
      color: #fff1d6;
    }

    .rt-name {
      font-family: 'Shippori Mincho', serif;
      font-weight: 700;
      font-size: 16px;
      margin: 10px 0 2px;
      letter-spacing: .03em;
    }

    .rt-total {
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      font-size: 18px;
      margin-top: 2px;
    }

    .rt-sub {
      font-size: 10.5px;
      color: var(--ink-soft);
      margin-top: 4px;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ---------- Ranking table ---------- */
    .table-card {
      background: rgba(241, 232, 214, 0.04);
      border: 1px solid var(--felt-line);
      border-radius: 14px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    thead th {
      text-align: right;
      font-weight: 500;
      color: var(--gold-soft);
      padding: 14px 16px;
      font-size: 11.5px;
      letter-spacing: .08em;
      border-bottom: 1px solid var(--felt-line);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    thead th:first-child,
    thead th:nth-child(2) {
      text-align: left;
    }

    thead th:hover {
      color: var(--gold);
    }

    thead th .arrow {
      opacity: .4;
      font-size: 9px;
      margin-left: 3px;
    }

    tbody td {
      padding: 14px 16px;
      text-align: right;
      border-bottom: 1px solid var(--felt-line);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody td:first-child,
    tbody td:nth-child(2) {
      text-align: left;
    }

    tbody tr:hover {
      background: rgba(241, 232, 214, 0.05);
    }

    .rk {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 5px;
      font-family: 'Shippori Mincho', serif;
      font-weight: 700;
      font-size: 13px;
      background: var(--felt-line);
      color: var(--ivory-soft);
    }

    .rk.r1 {
      background: var(--gold);
      color: #2b2103;
    }

    .rk.r2 {
      background: #cfd6d1;
      color: #26332c;
    }

    .rk.r3 {
      background: #8a6a3a;
      color: #fff1d6;
    }

    .pname {
      font-weight: 700;
      letter-spacing: .03em;
    }

    .num.plus {
      color: var(--ok);
    }

    .num.minus {
      color: var(--red-soft);
    }

    .pill-row {
      display: inline-flex;
      gap: 4px;
    }

    .pip {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      color: #2b2103;
    }

    .pip.p1 {
      background: var(--gold);
    }

    .pip.p2 {
      background: #cfd6d1;
      color: #26332c;
    }

    .pip.p3 {
      background: #8a6a3a;
      color: #fff1d6;
    }

    .pip.p4 {
      background: rgba(178, 58, 50, 0.6);
      color: #fff;
    }

    .muted {
      color: var(--ivory-soft);
      opacity: .55;
      font-size: 12px;
    }

    /* ---------- Session cards ---------- */
    .sessions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width:760px) {
      .sessions {
        grid-template-columns: 1fr;
      }
    }

    .session-card {
      background: rgba(241, 232, 214, 0.04);
      border: 1px solid var(--felt-line);
      border-radius: 14px;
      padding: 20px 20px 8px;
    }

    .session-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .session-date {
      font-family: 'Shippori Mincho', serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--gold-soft);
    }

    .session-head .muted {
      font-size: 11px;
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    .mini-table th {
      text-align: right;
      font-weight: 500;
      color: var(--ivory-soft);
      font-size: 10.5px;
      opacity: .6;
      padding: 6px 6px;
      letter-spacing: .05em;
    }

    .mini-table th:first-child {
      text-align: left;
    }

    .mini-table td {
      padding: 8px 6px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      border-top: 1px solid var(--felt-line);
    }

    .mini-table td:first-child {
      text-align: left;
      font-weight: 700;
    }

    .round-cell {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      line-height: 1.3;
    }

    .round-cell .rk-tag {
      font-size: 9px;
      opacity: .6;
    }

    /* ---------- Name links ---------- */
    a.name-link {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px dashed transparent;
      transition: color .15s, border-color .15s;
    }

    a.name-link:hover {
      color: var(--gold-soft);
      border-bottom-color: var(--gold-soft);
    }

    /* ---------- Player page ---------- */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--gold-soft);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: .03em;
      margin-bottom: 28px;
      opacity: .85;
    }

    .back-link:hover {
      opacity: 1;
    }

    .player-hero {
      display: flex;
      align-items: center;
      gap: 22px;
      background: rgba(241, 232, 214, 0.04);
      border: 1px solid var(--felt-line);
      border-radius: 14px;
      padding: 26px 28px;
      flex-wrap: wrap;
    }

    .player-hero .rank-badge {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      background: linear-gradient(180deg, var(--ivory) 0%, var(--ivory-soft) 100%);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Shippori Mincho', serif;
      font-weight: 800;
      font-size: 26px;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }
    .player-hero .rank-badge.r1 { background: var(--gold); color: #2b2103; }
    .player-hero .rank-badge.r2 { background: #cfd6d1; color: #26332c; }
    .player-hero .rank-badge.r3 { background: #8a6a3a; color: #fff1d6; }

    .player-hero-body {
      flex: 1;
      min-width: 200px;
    }

    .player-hero-name {
      font-family: 'Shippori Mincho', serif;
      font-weight: 800;
      font-size: clamp(24px, 4vw, 32px);
      letter-spacing: .05em;
    }

    .player-hero-sub {
      font-size: 12px;
      color: var(--ivory-soft);
      opacity: .65;
      margin-top: 4px;
    }

    .player-hero-total {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .player-hero-total .big {
      font-weight: 900;
      font-size: 30px;
    }

    .player-hero-total .lbl {
      font-size: 11px;
      color: var(--ivory-soft);
      opacity: .6;
      letter-spacing: .08em;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 14px;
      margin-top: 26px;
    }

    .stat-card {
      background: rgba(241, 232, 214, 0.04);
      border: 1px solid var(--felt-line);
      border-radius: 10px;
      padding: 16px 16px 14px;
    }

    .stat-card .lbl {
      font-size: 11px;
      color: var(--gold-soft);
      letter-spacing: .06em;
      opacity: .85;
    }

    .stat-card .val {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      font-size: 20px;
      margin-top: 6px;
    }

    .panel-title {
      font-family: 'Shippori Mincho', serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .05em;
      margin: 40px 0 16px;
      color: var(--gold-soft);
    }

    .dist-rows {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dist-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12.5px;
    }

    .dist-row .dist-lbl {
      width: 38px;
      flex-shrink: 0;
      color: var(--ivory-soft);
      opacity: .75;
    }

    .dist-track {
      flex: 1;
      height: 10px;
      background: rgba(241, 232, 214, 0.08);
      border-radius: 5px;
      overflow: hidden;
    }

    .dist-bar {
      height: 100%;
      border-radius: 5px;
    }

    .dist-bar.d1 {
      background: var(--gold);
    }

    .dist-bar.d2 {
      background: #cfd6d1;
    }

    .dist-bar.d3 {
      background: #8a6a3a;
    }

    .dist-bar.d4 {
      background: var(--red-soft);
    }

    .dist-count {
      width: 42px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      opacity: .8;
    }

    .dist-flex {
      display: flex;
      align-items: center;
      gap: 30px;
      flex-wrap: wrap;
      background: rgba(241, 232, 214, 0.04);
      border: 1px solid var(--felt-line);
      border-radius: 10px;
      padding: 18px 20px;
    }

    .dist-flex .dist-rows {
      flex: 1;
      min-width: 200px;
    }

    .dist-donut {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .dist-legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 10.5px;
      color: var(--ivory-soft);
      opacity: .85;
    }

    .dist-legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .dist-legend i {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      display: inline-block;
    }

    .radar-wrap {
      background: rgba(241, 232, 214, 0.04);
      border: 1px solid var(--felt-line);
      border-radius: 10px;
      padding: 18px;
      display: flex;
      justify-content: center;
    }

    .trend-wrap {
      background: rgba(241, 232, 214, 0.04);
      border: 1px solid var(--felt-line);
      border-radius: 10px;
      padding: 18px 18px 8px;
    }

    .trend-wrap svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .empty-state {
      color: var(--ivory-soft);
      opacity: .55;
      font-size: 13px;
      padding: 30px 0;
      text-align: center;
    }

    /* ---------- Update page ---------- */
    .update-card {
      background: rgba(241, 232, 214, 0.04);
      border: 1px solid var(--felt-line);
      border-radius: 14px;
      padding: 26px 26px 24px;
    }

    .field-group {
      margin-bottom: 22px;
    }

    .field-label {
      display: block;
      font-size: 12px;
      color: var(--gold-soft);
      letter-spacing: .06em;
      margin-bottom: 10px;
    }

    input[type="date"],
    input[type="text"],
    input[type="number"] {
      background: rgba(241, 232, 214, 0.9);
      border: 1px solid var(--felt-line);
      color: var(--ink);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13.5px;
      font-variant-numeric: tabular-nums;
    }

    input[type="date"] {
      min-width: 160px;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--felt-line);
      background: rgba(241, 232, 214, 0.04);
      color: var(--ivory-soft);
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      transition: all .12s;
    }

    .chip.selected {
      background: var(--gold);
      border-color: var(--gold);
      color: #2b2103;
      font-weight: 700;
    }

    .add-player-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .add-player-row input {
      flex: 1;
      min-width: 120px;
    }

    .round-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .round-block {
      border: 1px solid var(--felt-line);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
      background: rgba(241, 232, 214, 0.02);

    .round-block-head {
      display: flex;

      font-size: 12.5px;

    .round-inputs {

      display: flex;

    .icon-btn {

    .summary-table {
      width: 100%;

    .summary-table td {
      padding: 8px 6px;
      text-align: right;
      border-top: 1px solid var(--felt-line);
      font-variant-numeric: tabular-nums;

    .summary-table td:first-child {
      text-align: left;
      font-weight: 700;
    }

    .form-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
      flex-wrap: wrap;

    .status-msg {
      font-size: 12.5px;

    .status-msg.ok {

    .status-msg.err {
      color: var(--red-soft);

    .existing-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--felt-line);
      font-size: 13px;

    .existing-row:last-child {

    .existing-row .exr-date {
      font-weight: 700;
      font-family: 'Shippori Mincho', serif;

    .existing-row .exr-meta {
      color: var(--ivory-soft);
      opacity: .6;
      font-size: 11.5px;
      margin-left: 10px;

    .save-note {
      font-size: 11px;
      color: var(--ivory-soft);
      opacity: .5;
      margin-top: 10px;
      line-height: 1.7;
    }

    /* ---------- Footer ---------- */
    footer {
      margin-top: 70px;
      text-align: center;
      font-size: 11.5px;
      color: var(--ivory-soft);
      opacity: .5;
      letter-spacing: .05em;
    }

    @media (prefers-reduced-motion: reduce) {
      .rank-tile {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div id="loading-overlay">
    <div class="loading-tile">
      <div class="loading-spinner"></div>
      <div class="loading-text">読み込み中…</div>
      <div class="loading-sub">スプレッドシートから成績を取得しています</div>
    </div>
  </div>
  <div class="wrap">

    <header>
      <div class="eyebrow">MAHJONG LEAGUE · フルコンプ麻雀グループ</div>
      <h1>麻雀成績記録<span></span></h1>
      <div class="tile-rule">
        <div class="bar"></div>
        <div class="dot"></div>
        <div class="bar"></div>
      </div>
      <div class="header-actions">
        <a class="btn" href="#/update">＋ 対局結果を登録する</a>
      </div>
    </header>

    <div id="view-home">

      <section id="rank-section">
        <div class="sec-head">
          <h2>総合順位</h2>
          <div class="sec-note" id="rank-note"></div>
        </div>
        <div class="rank-strip" id="rank-strip"></div>
      </section>

      <section id="ranking-section">
        <div class="sec-head">
          <h2>通算成績表</h2>
          <div class="sec-note">列見出しをクリックで並び替え / 名前クリックで個人ページへ</div>
        </div>
        <div class="table-card">
          <table id="ranking-table">
            <thead>
              <tr>
                <th data-key="rank" data-type="num">順位<span class="arrow">▲▼</span></th>
                <th data-key="name" data-type="str">名前</th>
                <th data-key="total" data-type="num">通算得点<span class="arrow">▲▼</span></th>
                <th data-key="games" data-type="num">対局数<span class="arrow">▲▼</span></th>
                <th data-key="avgRank" data-type="num">順位率<span class="arrow">▲▼</span></th>
                <th data-key="avg" data-type="num">平均得点<span class="arrow">▲▼</span></th>
                <th data-key="topRate" data-type="num">トップ率<span class="arrow">▲▼</span></th>
                <th data-key="top2Rate" data-type="num">連対率<span class="arrow">▲▼</span></th>
                <th data-key="avoidLast" data-type="num">ラス回避率<span class="arrow">▲▼</span></th>
                <th data-key="best" data-type="num">ベストスコア<span class="arrow">▲▼</span></th>
                <th data-key="none" data-type="none">直近成績</th>
              </tr>
            </thead>
            <tbody id="ranking-body"></tbody>
          </table>
        </div>
      </section>

      <section id="sessions-section">
        <div class="sec-head">
          <h2>対局結果</h2>
          <div class="sec-note">得点はウマ込みの得失点</div>
        </div>
        <div class="sessions" id="sessions"></div>
      </section>

    </div>

    <div id="view-player" style="display:none"></div>
    <div id="view-update" style="display:none"></div>

    <footer id="footer-note">読み込み中…</footer>
  </div>

  <script>
    /* ====== 初期データ（麻雀成績表.xlsx より・初回のみ使用）====== */
    const DEFAULT_DATA = {
      playerNames: ["大浦", "石川", "佐藤", "小谷", "宮崎"],
      sessions: [
        {
          date: "2026-07-16",
          label: "2026年7月16日",
          results: {
            "大浦": { rounds: [32.7, 5.6, -1, -24.2] },
            "石川": { rounds: [-21.3, -12.5, -30.1, -18.2] },
            "佐藤": { rounds: [6.9, 39.8, 37.9, -15.2] },
            "小谷": { rounds: [-18.3, -32.9, -6.8, 57.6] },
          }
        },
        {
          date: "2026-07-28",
          label: "2026年7月28日",
          results: {
            "大浦": { rounds: [36.3, 37.4, -5.9, 31.3] },
            "石川": { rounds: [12.7, -9.8, 1.5, -30.1] },
            "佐藤": { rounds: [-18.7, -17.7, -27.7, 6.4] },
            "小谷": { rounds: [-30.3, -9.9, 32.1, -7.6] },
          }
        }
      ]
    };

    /* ====== 保存（Googleスプレッドシート + Apps Script API）======
       セットアップ手順は別途お渡しした案内をご覧ください。
       デプロイ後、下記 SHEET_API_URL に発行された /exec のURLを貼り付けてください。 */
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzIv1ecDOaquIh93MiGLWzN2OUaqzTGBlxMA2B0ACryaGB1zH7eU0FM7jT4-eO2jB0Lqw/exec";
    const API_CONFIGURED = /^https:\/\/script\.google\.com\/macros\//.test(SHEET_API_URL);

    let appData = null;
    let storageAvailable = false;

    function dateLabel(dateStr) {
      const [y, m, d] = dateStr.split("-");
      return `${y}年${Number(m)}月${Number(d)}日`;
    }

    async function apiCall(action, payload) {
      if (!API_CONFIGURED) return { ok: false, error: "not configured" };
      try {
        const res = await fetch(SHEET_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" }, // プリフライトを避けるため text/plain で送信
          body: JSON.stringify({ action, payload }),
        });
        return await res.json();
      } catch (e) {
        console.error("API呼び出しに失敗:", action, e);
        return { ok: false, error: String(e) };
      }
    }

    async function apiFetchAll() {
      const res = await fetch(SHEET_API_URL + "?action=getAll", { method: "GET" });
      if (!res.ok) throw new Error("getAll failed: " + res.status);
      return await res.json();
    }

    function normalizeSession(s) {
      // rounds付きの参加者から順位を自動計算して保持する（null/undefinedはその回戦の抜け番として扱う）
      const names = Object.keys(s.results);
      const nRounds = Math.max(0, ...names.map(n => s.results[n].rounds.length));
      const roundRanks = [];
      for (let i = 0; i < nRounds; i++) {
        const entries = names
          .filter(n => s.results[n].rounds[i] !== undefined && s.results[n].rounds[i] !== null)
          .map(n => ({ n, score: s.results[n].rounds[i] }))
          .sort((a, b) => b.score - a.score);
        const rankMap = {};
        entries.forEach((e, idx) => { rankMap[e.n] = idx + 1; });
        roundRanks.push(rankMap);
      }
      const totals = {};
      names.forEach(n => {
        totals[n] = s.results[n].rounds
          .filter(v => v !== undefined && v !== null)
          .reduce((a, b) => a + b, 0);
      });
      const sessionOrder = [...names].sort((a, b) => totals[b] - totals[a]);
      const sessionRankMap = {};
      sessionOrder.forEach((n, idx) => { sessionRankMap[n] = idx + 1; });

      const results = {};
      names.forEach(n => {
        results[n] = {
          rank: sessionRankMap[n],
          total: totals[n],
          rounds: s.results[n].rounds.map((score, i) =>
            (score === undefined || score === null) ? [null, null] : [score, roundRanks[i][n]]
          ),
        };
      });
      return { date: s.date, label: s.label || dateLabel(s.date), rounds: nRounds, results };
    }

    async function seedInitialData() {
      // スプレッドシートが空のときだけ、最初の対局データを一度だけ流し込む
      for (const name of DEFAULT_DATA.playerNames) {
        await apiCall("addPlayer", { name });
      }
      for (const s of DEFAULT_DATA.sessions) {
        await apiCall("saveSession", { date: s.date, results: s.results });
      }
    }

    async function loadData() {
      if (API_CONFIGURED) {
        try {
          let data = await apiFetchAll();
          if ((!data.playerNames || data.playerNames.length === 0) && (!data.sessions || data.sessions.length === 0)) {
            await seedInitialData();
            data = await apiFetchAll();
          }
          appData = {
            playerNames: (data.playerNames && data.playerNames.length) ? data.playerNames : DEFAULT_DATA.playerNames,
            sessions: data.sessions || [],
          };
          storageAvailable = true;
          return;
        } catch (e) {
          console.error("スプレッドシートの読み込みに失敗しました。ローカルの初期データで表示します。", e);
        }
      }
      storageAvailable = false;
      appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    // 対局1件の保存（新規・上書き）。成功したかどうかを返す。
    async function saveSessionToSheet(date, results) {
      if (!API_CONFIGURED) { storageAvailable = false; return false; }
      const res = await apiCall("saveSession", { date, results });
      storageAvailable = !!(res && res.ok);
      return storageAvailable;
    }

    async function deleteSessionFromSheet(date) {
      if (!API_CONFIGURED) { storageAvailable = false; return false; }
      const res = await apiCall("deleteSession", { date });
      storageAvailable = !!(res && res.ok);
      return storageAvailable;
    }

    async function addPlayerToSheet(name) {
      if (!API_CONFIGURED) return false;
      const res = await apiCall("addPlayer", { name });
      return !!(res && res.ok);
    }

    /* ====== 集計 ====== */
    function buildStats() {
      const stats = {};
      appData.playerNames.forEach(name => {
        stats[name] = { name, total: 0, games: 0, placements: [0, 0, 0, 0], scores: [], sessionRanks: [] };
      });
      const sessionsNorm = appData.sessions.map(normalizeSession).sort((a, b) => a.date.localeCompare(b.date));
      sessionsNorm.forEach(s => {
        Object.entries(s.results).forEach(([name, r]) => {
          if (!stats[name]) { stats[name] = { name, total: 0, games: 0, placements: [0, 0, 0, 0], scores: [], sessionRanks: [] }; }
          const st = stats[name];
          st.sessionRanks.push({ date: s.date, rank: r.rank });
          r.rounds.forEach(([score, rk]) => {
            if (score === null || score === undefined || rk === null || rk === undefined) return; // 抜け番はカウントしない
            st.placements[rk - 1] += 1;
            st.scores.push(score);
            st.total += score;
            st.games += 1;
          });
        });
      });
      Object.values(stats).forEach(st => {
        const n = st.games;
        st.avg = n ? st.total / n : null;
        st.avgRank = n ? (st.placements[0] * 1 + st.placements[1] * 2 + st.placements[2] * 3 + st.placements[3] * 4) / n : null;
        st.topRate = n ? st.placements[0] / n : null;
        st.top2Rate = n ? (st.placements[0] + st.placements[1]) / n : null;
        st.avoidLast = n ? 1 - (st.placements[3] / n) : null;
        st.best = st.scores.length ? Math.max(...st.scores) : null;
      });
      const ranked = Object.values(stats).filter(s => s.games > 0).sort((a, b) => b.total - a.total);
      ranked.forEach((s, i) => { s.rank = i + 1; });
      const unranked = Object.values(stats).filter(s => s.games === 0);
      unranked.forEach(s => { s.rank = null; });
      const rangeOf = key => {
        const vals = ranked.map(s => s[key]).filter(v => v !== null && v !== undefined);
        if (!vals.length) return { min: 0, max: 0 };
        return { min: Math.min(...vals), max: Math.max(...vals) };
      };
      const ranges = {
        avgRank: rangeOf('avgRank'),
        avg: rangeOf('avg'),
        topRate: rangeOf('topRate'),
        top2Rate: rangeOf('top2Rate'),
        avoidLast: rangeOf('avoidLast'),
        best: rangeOf('best'),
      };
      return { list: [...ranked, ...unranked], sessions: sessionsNorm, ranges };
    }

    const fmt1 = v => v === null || v === undefined || Number.isNaN(v) ? "―" : (v > 0 ? "+" : "") + v.toFixed(1);
    const fmtRank = v => v === null || v === undefined ? "―" : v.toFixed(2);
    const fmtPct = v => v === null || v === undefined ? "―" : (v * 100).toFixed(1) + "%";
    const numClass = v => v === null || v === undefined ? "" : (v > 0 ? "num plus" : v < 0 ? "num minus" : "num");
    const nameLink = name => `<a class="name-link" href="#/player/${encodeURIComponent(name)}">${name}</a>`;
    const roundCellHTML = ([score, rk]) => {
      if (score === null || score === undefined) {
        return `<td><div class="round-cell"><span class="muted">―</span></div></td>`;
      }
      return `<td><div class="round-cell"><span class="${numClass(score)}">${fmt1(score)}</span><span class="rk-tag">${rk}着</span></div></td>`;
    };

    /* ====== 総合順位（全員表示・成績順）====== */
    function renderRankStrip() {
      const el = document.getElementById('rank-strip');
      const note = document.getElementById('rank-note');
      const list = stats.list;
      note.textContent = `全${stats.sessions.length}回 · ${list.filter(s => s.games > 0).length}名参加中`;
      el.innerHTML = list.map(s => {
        const isRanked = !!s.rank;
        const cls = s.rank === 1 ? "r1" : s.rank === 2 ? "r2" : s.rank === 3 ? "r3" : "";
        return `<div class="rank-tile ${isRanked ? '' : 'unranked'}">
      <div class="rt-badge ${cls}">${isRanked ? s.rank : '―'}</div>
      <div class="rt-name">${nameLink(s.name)}</div>
      ${isRanked
            ? `<div class="rt-total" style="color:${s.total >= 0 ? '#245b3f' : 'var(--red)'}">${fmt1(s.total)}</div>
           <div class="rt-sub">${s.games}局 · 平均 ${fmt1(s.avg)}</div>`
            : `<div class="rt-sub" style="margin-top:8px;">未参加</div>`}
    </div>`;
      }).join("");
    }

    function renderTable(sortKey = null, dir = 1) {
      let rows = [...stats.list];
      if (sortKey) {
        rows.sort((a, b) => {
          let av = a[sortKey], bv = b[sortKey];
          if (typeof av === "string") return av.localeCompare(bv) * dir;
          const aNull = av === null || av === undefined;
          const bNull = bv === null || bv === undefined;
          if (aNull && bNull) return 0;
          if (aNull) return 1;
          if (bNull) return -1;
          return (av - bv) * dir;
        });
      }
      const body = document.getElementById('ranking-body');
      body.innerHTML = rows.map(s => {
        const rkClass = s.rank === 1 ? "r1" : s.rank === 2 ? "r2" : s.rank === 3 ? "r3" : "";
        const rkLabel = s.rank ?? "―";
        const pipsHTML = s.sessionRanks.map(r => `<span class="pip p${r.rank}">${r.rank}</span>`).join("");
        return `<tr>
      <td><span class="rk ${rkClass}">${rkLabel}</span></td>
      <td class="pname">${nameLink(s.name)}</td>
      <td class="${numClass(s.total)}">${fmt1(s.total)}</td>
      <td>${s.games}</td>
      <td>${fmtRank(s.avgRank)}</td>
      <td class="${numClass(s.avg)}">${fmt1(s.avg)}</td>
      <td>${fmtPct(s.topRate)}</td>
      <td>${fmtPct(s.top2Rate)}</td>
      <td>${fmtPct(s.avoidLast)}</td>
      <td class="${numClass(s.best)}">${fmt1(s.best)}</td>
      <td><span class="pill-row">${pipsHTML || '<span class="muted">未参加</span>'}</span></td>
    </tr>`;
      }).join("");
    }

    function renderSessions() {
      const el = document.getElementById('sessions');
      if (stats.sessions.length === 0) {
        el.innerHTML = `<div class="empty-state">まだ対局が登録されていません。「対局結果を登録する」から追加できます。</div>`;
        return;
      }
      el.innerHTML = [...stats.sessions].reverse().map(s => {
        const rows = Object.entries(s.results)
          .sort((a, b) => a[1].rank - b[1].rank)
          .map(([name, r]) => {
            const roundCells = r.rounds.map(roundCellHTML).join("");
            const rkClass = r.rank === 1 ? "r1" : r.rank === 2 ? "r2" : r.rank === 3 ? "r3" : "";
            return `<tr>
          <td>${nameLink(name)}</td>
          <td><span class="rk ${rkClass}" style="width:20px;height:20px;font-size:11px;">${r.rank}</span></td>
          <td class="${numClass(r.total)}">${fmt1(r.total)}</td>
          ${roundCells}
        </tr>`;
          }).join("");
        const roundHeaders = Array.from({ length: s.rounds }, (_, i) => `<th>${i + 1}回戦</th>`).join("");
        return `<div class="session-card">
      <div class="session-head">
        <div class="session-date">${s.label}</div>
        <div class="muted">全${s.rounds}回戦</div>
      </div>
      <table class="mini-table">
        <thead><tr><th>名前</th><th>着順</th><th>合計</th>${roundHeaders}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
      }).join("");
    }

    /* ====== 個人ページ ====== */
    function buildTrend(name) {
      const pts = [0];
      stats.sessions.forEach(s => {
        const r = s.results[name];
        if (!r) return;
        r.rounds.forEach(([score]) => {
          if (score === null || score === undefined) return; // 抜け番はグラフに反映しない
          pts.push(pts[pts.length - 1] + score);
        });
      });
      return pts;
    }

    function renderTrendSVG(name) {
      const pts = buildTrend(name);
      if (pts.length <= 1) return `<div class="empty-state">対局データがありません</div>`;

      // 1. キリの良い目盛りステップ幅を動的に決める（50刻み、20刻み、10刻みなど）
      const realMin = Math.min(...pts, 0);
      const realMax = Math.max(...pts, 0);
      const diff = realMax - realMin;

      let step = 50;
      if (diff <= 60) step = 20;
      else if (diff <= 120) step = 30;
      else if (diff <= 200) step = 50;
      else step = 100;

      // 目盛りの最小値・最大値をキリの良い数値（stepの倍数）に丸める
      const minVal = Math.floor(realMin / step) * step;
      const maxVal = Math.ceil(realMax / step) * step;

      // 2. 描画領域・パディングの設定
      const W = 500, H = 220;
      const padLeft = 55, padRight = 30, padTop = 30, padBottom = 35;

      const range = (maxVal - minVal) || 1;
      const xAt = i => padLeft + (i / (pts.length - 1)) * (W - padLeft - padRight);
      const yAt = v => H - padBottom - ((v - minVal) / range) * (H - padTop - padBottom);

      const zeroY = yAt(0);
      const path = pts.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xAt(i).toFixed(1)} ${yAt(v).toFixed(1)}`).join(' ');
      const areaPath = `${path} L ${xAt(pts.length - 1).toFixed(1)} ${zeroY.toFixed(1)} L ${xAt(0).toFixed(1)} ${zeroY.toFixed(1)} Z`;

      const last = pts[pts.length - 1];
      const strokeColor = last >= 0 ? '#e8cd6d' : '#d97a6f';

      // 3. Y軸（縦軸）のキリの良い目盛り配列を生成
      const ticks = [];
      for (let v = minVal; v <= maxVal; v += step) {
        ticks.push(v);
      }

      return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
    <!-- グリッド線とY軸のキリの良い目盛り数値 -->
    ${ticks.map(val => {
        const y = yAt(val).toFixed(1);
        const isZero = val === 0;
        return `
        <line x1="${padLeft}" y1="${y}" x2="${W - padRight}" y2="${y}" 
              stroke="${isZero ? 'rgba(241,232,214,0.4)' : 'rgba(241,232,214,0.08)'}" 
              stroke-dasharray="${isZero ? 'none' : '3,3'}" 
              stroke-width="${isZero ? '1.5' : '1'}"/>
        <text x="${padLeft - 10}" y="${Number(y) + 4}" 
              fill="${isZero ? 'var(--gold-soft)' : 'rgba(241,232,214,0.6)'}" 
              font-size="11" text-anchor="end" font-weight="${isZero ? 'bold' : 'normal'}">
          ${val > 0 ? '+' + val : val}
        </text>
      `;
      }).join('')}

    <!-- 面塗りつぶしと折れ線 -->
    <path d="${areaPath}" fill="${strokeColor}" opacity="0.12" stroke="none"/>
    <path d="${path}" fill="none" stroke="${strokeColor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- プロット点と重なりを防いだ数値表示 -->
    ${pts.map((v, i) => {
        const x = xAt(i);
        const y = yAt(v);

        // 前後の値と比較して、山なら上に、谷なら下にテキストを配置して重なりを防ぐ
        const prev = pts[i - 1] ?? v;
        const next = pts[i + 1] ?? v;
        const isValley = v < prev && v <= next;

        const textY = isValley ? y + 18 : y - 10;
        const labelText = v > 0 ? '+' + v.toFixed(1) : v.toFixed(1);

        return `
        <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${strokeColor}" stroke="var(--felt-deep)" stroke-width="1.5"/>
        <text x="${x.toFixed(1)}" y="${textY.toFixed(1)}" 
              fill="${v >= 0 ? '#7fd8ac' : '#d97a6f'}" 
              font-size="10" font-weight="700" text-anchor="middle"
              style="text-shadow: 0 1px 3px rgba(0,0,0,0.8);">
          ${labelText}
        </text>
      `;
      }).join('')}
  </svg>`;
    }

    function normAxis(value, key, invert) {
  const r = stats.ranges[key];
  if (!r || value === null || value === undefined) return 0;
  const span = r.max - r.min;
  if (span === 0) return 0.7;
  let t = (value - r.min) / span;
  if (invert) t = 1 - t;
  return Math.max(0.03, Math.min(1, t));
}

function renderRadarSVG(st) {
  if (!st.games) return `<div class="empty-state">対局データがありません</div>`;
  const axes = [
    { key: 'avgRank', label: '順位率', invert: true },
    { key: 'avg', label: '平均得点', invert: false },
    { key: 'topRate', label: 'トップ率', invert: false },
    { key: 'top2Rate', label: '連対率', invert: false },
    { key: 'avoidLast', label: 'ラス回避率', invert: false },
    { key: 'best', label: 'ベストスコア', invert: false },
  ];
  const W = 280, H = 260, cx = 140, cy = 132, R = 90;
  const angleFor = i => -Math.PI / 2 + i * (2 * Math.PI / axes.length);
  const pointAt = (i, t) => {
    const a = angleFor(i);
    const r = 10 + t * (R - 10);
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  };
  const ringPolys = [0.25, 0.5, 0.75, 1].map(level => {
    const pts = axes.map((_, i) => pointAt(i, level));
    return `<polygon points="${pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="rgba(241,232,214,0.12)" stroke-width="1"/>`;
  }).join('');
  const axisLines = axes.map((_, i) => {
    const [x, y] = pointAt(i, 1);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(241,232,214,0.15)" stroke-width="1"/>`;
  }).join('');
  const labels = axes.map((ax, i) => {
    const [x, y] = pointAt(i, 1.22);
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="var(--gold-soft)">${ax.label}</text>`;
  }).join('');
  const dataPts = axes.map((ax, i) => pointAt(i, normAxis(st[ax.key], ax.key, ax.invert)));
  const dataPoly = `<polygon points="${dataPts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="var(--gold)" opacity="0.28" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round"/>`;
  const dataDots = dataPts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--gold-soft)"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; max-width:320px; height:auto; display:block;">
    ${ringPolys}
    ${axisLines}
    ${dataPoly}
    ${dataDots}
    ${labels}
  </svg>`;
}

function renderDistDonut(st) {
  if (!st.games) return '';
  const colors = ['#c9a227', '#cfd6d1', '#8a6a3a', '#d97a6f'];
  const labels = ['1着', '2着', '3着', '4着'];
  const r = 46, cx = 64, cy = 64, circumference = 2 * Math.PI * r;
  let offsetAcc = 0;
  const segs = st.placements.map((count, i) => {
    const frac = count / st.games;
    const dash = frac * circumference;
    const seg = frac > 0 ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i]}" stroke-width="16"
      stroke-dasharray="${dash.toFixed(2)} ${(circumference - dash).toFixed(2)}"
      stroke-dashoffset="${(-offsetAcc).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>` : '';
    offsetAcc += dash;
    return seg;
  }).join('');
  const legend = st.placements.map((count, i) => {
    const pct = st.games ? (count / st.games * 100).toFixed(0) : 0;
    return `<span><i style="background:${colors[i]}"></i>${labels[i]} ${pct}%</span>`;
  }).join('');
  return `<div class="dist-donut">
    <svg viewBox="0 0 128 128" style="width:130px;height:130px;display:block;">
      ${segs}
      <circle cx="${cx}" cy="${cy}" r="${r - 9}" fill="var(--felt-deep2)"/>
      <text x="${cx}" y="${cy - 1}" text-anchor="middle" font-size="19" font-weight="800" fill="var(--ivory)">${st.games}</text>
      <text x="${cx}" y="${cy + 15}" text-anchor="middle" font-size="9" fill="var(--ivory-soft)" opacity="0.7">局</text>
    </svg>
    <div class="dist-legend">${legend}</div>
  </div>`;
}

    <div class="panel-title">着順分布</div>
    <div class="dist-flex">

    <div class="panel-title">通算得点の推移</div>

    }

    /* ====== 更新ページ（対局結果の登録）====== */
    let draft = null;
    let pendingStatus = null; // {ok:boolean, text:string} 保存直後の再描画をまたいで表示するため

    function newDraft() {
      return {
        date: "",
        participants: [], // 名前の配列（選んだ順）
        rounds: [{}],    // [{name:score}, ...]
        editingDate: null, // 既存の対局を編集中ならその date
      };
    }

    function draftChecksum(roundIdx) {
      const round = draft.rounds[roundIdx];
      const sum = draft.participants.reduce((acc, name) => {
        const v = round[name];
        return acc + (v === undefined || v === "" || Number.isNaN(Number(v)) ? 0 : Number(v));
      }, 0);
      return sum;
    }

    function renderUpdatePage() {
      const el = document.getElementById('view-update');

      const chips = appData.playerNames.map(name => {
        const sel = draft.participants.includes(name);
        return `<div class="chip ${sel ? 'selected' : ''}" data-name="${name}">${name}</div>`;
      }).join('');

      const roundsHTML = draft.rounds.map((round, ri) => {
        if (draft.participants.length === 0) {
          return `<div class="round-block"><div class="empty-state" style="padding:10px 0;">先に参加者を選んでください</div></div>`;
        }
        const sum = draftChecksum(ri);
        const ok = Math.abs(sum) < 0.05;
        const inputs = draft.participants.map(name => {
          const val = round[name] !== undefined ? round[name] : "";
          return `<div class="round-input-item">
        <span>${name}</span>
        <input type="number" step="0.1" inputmode="decimal" placeholder="抜け番" data-round="${ri}" data-name="${name}" class="score-input" value="${val}">
      </div>`;
        }).join('');
        return `<div class="round-block">
      <div class="round-block-head">
        <span>${ri + 1}回戦</span>
        <span class="round-checksum ${ok ? 'ok' : 'warn'}">合計 ${sum.toFixed(1)} ${ok ? '✓ ゼロサムOK' : '(通常は0になります)'}</span>
        ${draft.rounds.length > 1 ? `<button type="button" class="icon-btn remove-round-btn" data-round="${ri}">✕</button>` : ''}
      </div>
      <div class="round-inputs">${inputs}</div>
    </div>`;
      }).join('');

      // サマリー（保存前プレビュー）
      let summaryHTML = '';
      if (draft.participants.length > 0) {
        const totals = draft.participants.map(name => {
          const total = draft.rounds.reduce((a, r) => a + (Number(r[name]) || 0), 0);
          return { name, total };
        }).sort((a, b) => b.total - a.total);
        summaryHTML = `<table class="summary-table">
      <thead><tr><th>名前</th><th>着順</th><th>合計</th></tr></thead>
      <tbody>${totals.map((t, i) => `<tr><td>${t.name}</td><td>${i + 1}</td><td class="${numClass(t.total)}">${fmt1(t.total)}</td></tr>`).join('')}</tbody>
    </table>`;
      }

      const existingHTML = stats.sessions.length ? [...stats.sessions].reverse().map(s => {
        return `<div class="existing-row">
      <div><span class="exr-date">${s.label}</span><span class="exr-meta">${Object.keys(s.results).join(' / ')}</span></div>
      <div style="display:flex; gap:8px;">
        <button type="button" class="btn ghost small edit-session-btn" data-date="${s.date}">編集</button>
        <button type="button" class="btn danger small delete-session-btn" data-date="${s.date}">削除</button>
      </div>
    </div>`;
      }).join('') : `<div class="empty-state">まだ対局が登録されていません</div>`;

      el.innerHTML = `
    <a class="back-link" href="#/">← 総合成績に戻る</a>
    <h2 class="panel-title" style="margin-top:0;">${draft.editingDate ? '対局結果を編集' : '対局結果を登録'}</h2>

    <div class="update-card">
      <div class="field-group">
        <label class="field-label">対局日</label>
        <input type="date" id="u-date" value="${draft.date}">
      </div>

      <div class="field-group">
        <label class="field-label">参加者を選択</label>
        <div class="chip-list" id="u-chips">${chips}</div>
        <div class="add-player-row">
          <input type="text" id="u-new-player" placeholder="新しいプレイヤー名を追加">
          <button type="button" class="btn ghost small" id="u-add-player-btn">追加</button>
        </div>
      </div>

      <div class="field-group">
        <div class="round-header-row">
          <label class="field-label" style="margin:0;">回戦ごとの得失点</label>
          <button type="button" class="btn ghost small" id="u-add-round-btn">＋ 回戦を追加</button>
        </div>
        <div class="sec-note" style="margin-bottom:10px;">5人以上参加している場合、その回戦を空欄のままにすると「抜け番」として扱われます</div>
        <div id="u-rounds">${roundsHTML}</div>
      </div>

      <div class="field-group" id="u-summary-wrap" style="${draft.participants.length ? '' : 'display:none'}">
        <label class="field-label">保存後のこの対局の順位（プレビュー）</label>
        ${summaryHTML}
      </div>

      <div class="form-actions">
        <button type="button" class="btn" id="u-save-btn">この対局を保存</button>
        ${draft.editingDate ? `<button type="button" class="btn ghost" id="u-cancel-edit-btn">編集をやめる</button>` : ''}
        <span class="status-msg ${pendingStatus ? (pendingStatus.ok ? 'ok' : 'err') : ''}" id="u-status">${pendingStatus ? pendingStatus.text : ''}</span>
      </div>
      <div class="save-note">${API_CONFIGURED
          ? 'Googleスプレッドシートに保存されます。このページを見ている全員に共有され、保存すると通算成績表にもすぐ反映されます。'
          : '※ スプレッドシート連携がまだ設定されていません。このままだと更新内容はページを閉じると失われます。'}</div>
    </div>

    <h2 class="panel-title">登録済みの対局</h2>
    <div class="table-card">${existingHTML}</div>
  `;

      bindUpdateEvents();
      pendingStatus = null;
    }

    function bindUpdateEvents() {
      document.getElementById('u-date').addEventListener('change', e => {
        draft.date = e.target.value;
      });

      document.querySelectorAll('#u-chips .chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const name = chip.dataset.name;
          const idx = draft.participants.indexOf(name);
          if (idx > -1) { draft.participants.splice(idx, 1); }
          else { draft.participants.push(name); }
          renderUpdatePage();
        });
      });

      document.getElementById('u-add-player-btn').addEventListener('click', async (e) => {
        const input = document.getElementById('u-new-player');
        const name = input.value.trim();
        if (!name) return;
        if (!appData.playerNames.includes(name)) {
          const btn = e.currentTarget;
          btn.disabled = true;
          btn.textContent = '追加中…';
          appData.playerNames.push(name);
          await addPlayerToSheet(name);
        }
        if (!draft.participants.includes(name)) draft.participants.push(name);
        renderUpdatePage();
      });

      document.getElementById('u-add-round-btn').addEventListener('click', () => {
        draft.rounds.push({});
        renderUpdatePage();
      });

      document.querySelectorAll('.remove-round-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          draft.rounds.splice(Number(btn.dataset.round), 1);
          renderUpdatePage();
        });
      });

      document.querySelectorAll('.score-input').forEach(input => {
        input.addEventListener('input', () => {
          const ri = Number(input.dataset.round);
          const name = input.dataset.name;
          draft.rounds[ri][name] = input.value;
          // チェックサムとサマリーだけ軽く更新（全体再描画はしない＝入力中のフォーカスを保つ）
          updateChecksumAndSummaryOnly();
        });
      });

      document.getElementById('u-save-btn').addEventListener('click', saveDraft);

      const cancelBtn = document.getElementById('u-cancel-edit-btn');
      if (cancelBtn) {
        cancelBtn.addEventListener('click', () => {
          draft = newDraft();
          renderUpdatePage();
        });
      }

      document.querySelectorAll('.delete-session-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const date = btn.dataset.date;
          if (!confirm(`${dateLabel(date)}の対局結果を削除します。よろしいですか？`)) return;
          btn.disabled = true;
          btn.textContent = '削除中…';
          appData.sessions = appData.sessions.filter(s => s.date !== date);
          await deleteSessionFromSheet(date);
          refreshAll();
          renderUpdatePage();
        });
      });

      document.querySelectorAll('.edit-session-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const date = btn.dataset.date;
          const raw = appData.sessions.find(s => s.date === date);
          if (!raw) return;
          const names = Object.keys(raw.results);
          const nRounds = Math.max(...names.map(n => raw.results[n].rounds.length));
          const rounds = [];
          for (let i = 0; i < nRounds; i++) {
            const r = {};
            names.forEach(n => { r[n] = raw.results[n].rounds[i]; });
            rounds.push(r);
          }
          draft = { date, participants: names, rounds, editingDate: date };
          renderUpdatePage();
          window.scrollTo(0, 0);
        });
      });
    }

    function updateChecksumAndSummaryOnly() {
      document.querySelectorAll('.round-block').forEach((block, ri) => {
        const el = block.querySelector('.round-checksum');
        if (!el) return;
        const sum = draftChecksum(ri);
        const ok = Math.abs(sum) < 0.05;
        el.className = `round-checksum ${ok ? 'ok' : 'warn'}`;
        el.textContent = `合計 ${sum.toFixed(1)} ${ok ? '✓ ゼロサムOK' : '(通常は0になります)'}`;
      });
      const wrap = document.getElementById('u-summary-wrap');
      if (!wrap) return;
      if (draft.participants.length > 0) {
        wrap.style.display = '';
        const totals = draft.participants.map(name => {
          const total = draft.rounds.reduce((a, r) => a + (Number(r[name]) || 0), 0);
          return { name, total };
        }).sort((a, b) => b.total - a.total);
        wrap.querySelector('.summary-table tbody').innerHTML = totals
          .map((t, i) => `<tr><td>${t.name}</td><td>${i + 1}</td><td class="${numClass(t.total)}">${fmt1(t.total)}</td></tr>`)
          .join('');
      }
    }

    async function saveDraft() {
      const statusEl = document.getElementById('u-status');
      statusEl.className = 'status-msg';
      statusEl.textContent = '';

      if (!draft.date) { statusEl.className = 'status-msg err'; statusEl.textContent = '対局日を入力してください。'; return; }
      if (draft.participants.length < 2) { statusEl.className = 'status-msg err'; statusEl.textContent = '参加者を2人以上選んでください。'; return; }
      if (draft.rounds.length < 1) { statusEl.className = 'status-msg err'; statusEl.textContent = '回戦を1つ以上追加してください。'; return; }

      const isFilled = v => v !== undefined && v !== "" && !Number.isNaN(Number(v));

      for (let ri = 0; ri < draft.rounds.length; ri++) {
        const filledCount = draft.participants.filter(name => isFilled(draft.rounds[ri][name])).length;
        if (filledCount === 0) {
          statusEl.className = 'status-msg err';
          statusEl.textContent = `${ri + 1}回戦の得失点が1件も入力されていません。`;
          return;
        }
      }
      for (const name of draft.participants) {
        const playedAny = draft.rounds.some(r => isFilled(r[name]));
        if (!playedAny) {
          statusEl.className = 'status-msg err';
          statusEl.textContent = `${name}さんの得失点が1回戦分も入力されていません。参加者から外すか、得失点を入力してください。`;
          return;
        }
      }

      const existingIdx = appData.sessions.findIndex(s => s.date === draft.date);
      if (existingIdx > -1 && draft.date !== draft.editingDate) {
        if (!confirm(`${dateLabel(draft.date)}にはすでに対局結果があります。上書きしますか？`)) return;
      }

      const saveBtn = document.getElementById('u-save-btn');
      if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '保存中…'; }
      statusEl.className = 'status-msg';
      statusEl.textContent = '保存中…';

      const results = {};
      draft.participants.forEach(name => {
        results[name] = { rounds: draft.rounds.map(r => isFilled(r[name]) ? Number(r[name]) : null) };
      });
      const session = { date: draft.date, label: dateLabel(draft.date), results };

      if (draft.editingDate && draft.editingDate !== draft.date) {
        appData.sessions = appData.sessions.filter(s => s.date !== draft.editingDate);
        await deleteSessionFromSheet(draft.editingDate);
      }
      const idx = appData.sessions.findIndex(s => s.date === draft.date);
      if (idx > -1) { appData.sessions[idx] = session; }
      else { appData.sessions.push(session); }

      const saved = await saveSessionToSheet(draft.date, results);
      refreshAll();

      pendingStatus = saved
        ? { ok: true, text: '保存しました。' }
        : { ok: false, text: API_CONFIGURED ? '保存に失敗しました。スプレッドシートAPIの設定をご確認ください。' : '保存に失敗しました（スプレッドシート連携が未設定のため、この内容はページを閉じると消えます）。' };

      draft = newDraft();
      renderUpdatePage();
    }

    /* ====== ルーティング ====== */
    /* ====== 対局結果登録のパスワードロック ====== */
    const UPDATE_PASSWORD = "1124";
    let isUnlocked = false;

    function renderLockScreen() {
      const el = document.getElementById('view-update');
      el.innerHTML = `
    <a class="back-link" href="#/">← 総合成績に戻る</a>
    <div class="lock-card">
      <div class="lock-icon">🀄</div>
      <p>対局結果の登録には4桁のパスワードが必要です。</p>
      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="lock-input" id="lock-input" autocomplete="off">
      <div class="lock-error" id="lock-error"></div>
      <button type="button" class="btn" id="lock-submit-btn">開く</button>
    </div>
  `;
      const input = document.getElementById('lock-input');
      const submit = () => {
        const errorEl = document.getElementById('lock-error');
        if (input.value === UPDATE_PASSWORD) {
          isUnlocked = true;
          if (!draft) draft = newDraft();
          renderUpdatePage();
        } else {
          errorEl.textContent = 'パスワードが違います。';
          input.value = '';
          input.focus();
        }
      };
      document.getElementById('lock-submit-btn').addEventListener('click', submit);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
      input.focus();
    }

    function route() {
      const hash = location.hash;
      const playerMatch = hash.match(/^#\/player\/(.+)$/);
      const home = document.getElementById('view-home');
      const player = document.getElementById('view-player');
      const update = document.getElementById('view-update');

      home.style.display = 'none';
      player.style.display = 'none';
      update.style.display = 'none';

      if (playerMatch) {
        renderPlayerPage(decodeURIComponent(playerMatch[1]));
        player.style.display = 'block';
      } else if (hash === '#/update') {
        if (isUnlocked) {
          if (!draft) draft = newDraft();
          renderUpdatePage();
        } else {
          renderLockScreen();
        }
        update.style.display = 'block';
      } else {
        home.style.display = '';
      }
      window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', route);

    /* ====== 再描画まとめ ====== */
    let stats = null;
    function refreshAll() {
      stats = buildStats();
      renderRankStrip();
      renderTable();
      renderSessions();
      document.getElementById('footer-note').textContent =
        `${appData.playerNames.join(' · ')}　—　最終更新 ${stats.sessions.length ? stats.sessions[stats.sessions.length - 1].label : '―'}`;
    }

    let currentSort = { key: null, dir: 1 };
    function bindSortHandlers() {
      document.querySelectorAll('#ranking-table thead th').forEach(th => {
        const key = th.dataset.key;
        if (key === "none") return;
        th.addEventListener('click', () => {
          if (currentSort.key === key) { currentSort.dir *= -1; }
          else { currentSort = { key, dir: (key === 'name' || key === 'avgRank') ? 1 : -1 }; }
          renderTable(currentSort.key, currentSort.dir);
        });
      });
    }

    /* ====== 起動 ====== */
    (async function init() {
      await loadData();
      refreshAll();
      bindSortHandlers();
      route();
      const overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.classList.add('hidden');
        setTimeout(() => { overlay.style.display = 'none'; }, 450);
      }
    })();
  </script>
</body>

</html>
